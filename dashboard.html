<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestroRx Dashboard — Chef Amey</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ember:#E8490A;--ember-d:rgba(232,73,10,0.13);
  --green:#1A9E5A;--green-d:rgba(26,158,90,0.12);
  --yellow:#C67E0A;--yellow-d:rgba(198,126,10,0.12);
  --red:#C0392B;--red-d:rgba(192,57,43,0.12);
  --blue:#1A6EBF;--blue-d:rgba(26,110,191,0.12);
  --bg:#0C0C0C;--s1:#151515;--s2:#1D1D1D;--br:#272727;
  --t1:#EFEBE5;--t2:#9A9490;--t3:#5C5855;
  --ff:'Outfit',sans-serif;--fd:'Cormorant Garamond',serif
}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);min-height:100vh}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
input,select{font-family:var(--ff);background:var(--s2);border:1px solid var(--br);color:var(--t1);border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--ember)}
input::placeholder{color:var(--t3)}
select option{background:#1D1D1D}
.btn{background:var(--ember);color:#fff;border:none;border-radius:9px;padding:12px 28px;font-family:var(--ff);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.card{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:20px}
.stat-card{background:var(--s1);border:1px solid var(--br);border-radius:12px;padding:16px;text-align:center}
.lead-row{background:var(--s1);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;animation:fadeIn .3s ease both}
.lead-row:hover{border-color:rgba(232,73,10,.35)}
.lead-row.expanded{border-color:rgba(232,73,10,.4)}
.filter-btn{background:transparent;color:var(--t2);border:1px solid var(--br);border-radius:20px;padding:6px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.filter-btn.active{background:var(--ember);color:#fff;border-color:var(--ember)}
.bar-wrap{height:5px;border-radius:3px;background:var(--br);margin-top:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 1s ease}
.status-btn{border:none;border-radius:6px;padding:5px 10px;font-family:var(--ff);font-size:11px;font-weight:600;cursor:pointer;transition:opacity .15s}
.status-btn:hover{opacity:.8}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--s1);border:1px solid var(--br);border-radius:18px;padding:40px 32px;text-align:center;max-width:360px;width:100%">
    <div style="width:48px;height:48px;background:var(--ember);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 20px">🍽️</div>
    <h1 style="font-family:var(--fd);font-size:26px;font-weight:700;margin-bottom:6px">RestroRx</h1>
    <p style="font-size:13px;color:var(--t2);margin-bottom:28px">Chef Amey's Lead Dashboard</p>
    <input type="password" id="pwd" placeholder="Enter password" style="width:100%;margin-bottom:12px;text-align:center" onkeydown="if(event.key==='Enter')checkPwd()">
    <div id="pwd-err" style="display:none;color:var(--red);font-size:13px;margin-bottom:12px">Incorrect password</div>
    <button class="btn" style="width:100%" onclick="checkPwd()">Enter Dashboard</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

  <!-- Nav -->
  <nav style="border-bottom:1px solid var(--br);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(12,12,12,.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;gap:9px">
      <div style="width:30px;height:30px;background:var(--ember);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px">🍽️</div>
      <div>
        <div style="font-family:var(--fd);font-size:17px;font-weight:700">RestroRx Dashboard</div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:2px">Chef Amey Marathe</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="exportCSV()" style="background:var(--s2);border:1px solid var(--br);color:var(--t1);border-radius:8px;padding:7px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer">⬇ Export CSV</button>
      <button onclick="loadLeads()" style="background:var(--s2);border:1px solid var(--br);color:var(--t1);border-radius:8px;padding:7px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer">↻ Refresh</button>
    </div>
  </nav>

  <div style="max-width:900px;margin:0 auto;padding:28px 20px">

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px" id="stats-grid">
      <div class="stat-card"><div id="stat-total" style="font-family:var(--fd);font-size:32px;font-weight:700;color:var(--ember)">—</div><div style="font-size:11px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">Total Leads</div></div>
      <div class="stat-card"><div id="stat-week" style="font-family:var(--fd);font-size:32px;font-weight:700;color:var(--blue)">—</div><div style="font-size:11px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">This Week</div></div>
      <div class="stat-card"><div id="stat-avg" style="font-family:var(--fd);font-size:32px;font-weight:700;color:var(--yellow)">—</div><div style="font-size:11px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">Avg Score</div></div>
      <div class="stat-card"><div id="stat-critical" style="font-family:var(--fd);font-size:32px;font-weight:700;color:var(--red)">—</div><div style="font-size:11px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">Critical 🔴</div></div>
    </div>

    <!-- Filters + Search -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px">
      <input id="search" type="text" placeholder="Search restaurant or name..." style="flex:1;min-width:200px" oninput="renderLeads()">
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="filter-btns">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" data-filter="IN" onclick="setFilter('IN',this)">🇮🇳 India</button>
        <button class="filter-btn" data-filter="US" onclick="setFilter('US',this)">🇺🇸 US</button>
        <button class="filter-btn" data-filter="new" onclick="setFilter('new',this)">New</button>
        <button class="filter-btn" data-filter="contacted" onclick="setFilter('contacted',this)">Contacted</button>
        <button class="filter-btn" data-filter="consultation_booked" onclick="setFilter('consultation_booked',this)">Booked</button>
        <button class="filter-btn" data-filter="converted" onclick="setFilter('converted',this)">Converted</button>
        <button class="filter-btn" data-filter="Critical" onclick="setFilter('Critical',this)">🔴 Critical</button>
      </div>
    </div>

    <!-- Leads -->
    <div id="leads-container">
      <div style="text-align:center;padding:60px 20px;color:var(--t3)">
        <div style="width:36px;height:36px;border:2px solid var(--br);border-top-color:var(--ember);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px"></div>
        Loading leads...
      </div>
    </div>

  </div>
</div>

<script>
// ─── CONFIG — Replace with your Supabase credentials ───
const SUPABASE_URL = 'https://dduiwrznrzmimqvmrcdg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdWl3cnpucnptaW1xdm1yY2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjY5NjAsImV4cCI6MjA5NDEwMjk2MH0.1-rjDnGkykflVZWnaHLGk1-b_oFqP1LX4dwb3Ro9IpY';
const DASHBOARD_PASSWORD = 'RestroRx2024';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let allLeads = [], activeFilter = 'all';

const sc = s => s >= 70 ? 'var(--green)' : s >= 45 ? 'var(--yellow)' : 'var(--red)';
const scH = s => s >= 70 ? '#1A9E5A' : s >= 45 ? '#C67E0A' : '#C0392B';
const ST = {
  'Healthy': { color: 'var(--green)', bg: 'var(--green-d)', icon: '●' },
  'Watch Zone': { color: 'var(--yellow)', bg: 'var(--yellow-d)', icon: '◐' },
  'Critical': { color: 'var(--red)', bg: 'var(--red-d)', icon: '○' }
};
const FS = {
  'new': { color: 'var(--blue)', bg: 'var(--blue-d)', label: 'New' },
  'contacted': { color: 'var(--yellow)', bg: 'var(--yellow-d)', label: 'Contacted' },
  'consultation_booked': { color: 'var(--ember)', bg: 'var(--ember-d)', label: 'Booked' },
  'converted': { color: 'var(--green)', bg: 'var(--green-d)', label: 'Converted ✓' }
};

function checkPwd() {
  const pwd = document.getElementById('pwd').value;
  if (pwd === DASHBOARD_PASSWORD) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadLeads();
  } else {
    document.getElementById('pwd-err').style.display = 'block';
    document.getElementById('pwd').value = '';
  }
}

async function loadLeads() {
  try {
    const { data, error } = await sb.from('leads').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allLeads = data || [];
    updateStats();
    renderLeads();
  } catch (e) {
    document.getElementById('leads-container').innerHTML = `<div style="text-align:center;padding:40px;color:var(--red)">Failed to load leads: ${e.message}<br><small style="color:var(--t3)">Check your Supabase URL and key in the config section</small></div>`;
  }
}

function updateStats() {
  document.getElementById('stat-total').textContent = allLeads.length;
  const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
  document.getElementById('stat-week').textContent = allLeads.filter(l => new Date(l.created_at) > weekAgo).length;
  const scored = allLeads.filter(l => l.health_score);
  document.getElementById('stat-avg').textContent = scored.length ? Math.round(scored.reduce((s, l) => s + l.health_score, 0) / scored.length) : '—';
  document.getElementById('stat-critical').textContent = allLeads.filter(l => l.status_label === 'Critical').length;
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderLeads();
}

function getFiltered() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  return allLeads.filter(l => {
    const matchSearch = !q || (l.restaurant || '').toLowerCase().includes(q) || (l.name || '').toLowerCase().includes(q) || (l.location || '').toLowerCase().includes(q);
    let matchFilter = true;
    if (activeFilter === 'IN') matchFilter = l.market === 'IN';
    else if (activeFilter === 'US') matchFilter = l.market === 'US';
    else if (activeFilter === 'new') matchFilter = l.follow_up_status === 'new';
    else if (activeFilter === 'contacted') matchFilter = l.follow_up_status === 'contacted';
    else if (activeFilter === 'consultation_booked') matchFilter = l.follow_up_status === 'consultation_booked';
    else if (activeFilter === 'converted') matchFilter = l.follow_up_status === 'converted';
    else if (activeFilter === 'Critical') matchFilter = l.status_label === 'Critical';
    return matchSearch && matchFilter;
  });
}

function renderLeads() {
  const filtered = getFiltered();
  const container = document.getElementById('leads-container');
  if (!filtered.length) {
    container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--t3)">No leads found</div>`;
    return;
  }
  container.innerHTML = filtered.map(l => leadCard(l)).join('');
}

function leadCard(l) {
  const st = ST[l.status_label] || ST['Watch Zone'];
  const fs = FS[l.follow_up_status] || FS['new'];
  const date = new Date(l.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const market = l.market === 'IN' ? '🇮🇳' : l.market === 'US' ? '🇺🇸' : '🌍';
  const score = l.final_score || l.health_score || 0;
  const color = scH(score);
  return `<div class="lead-row" id="row-${l.id}" onclick="toggleExpand('${l.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:16px">${market}</span>
          <span style="font-weight:600;font-size:15px">${l.restaurant||'Unknown'}</span>
          <span class="tag" style="background:${st.bg};color:${st.color};border:1px solid ${st.color}44;font-size:10px">${st.icon} ${l.status_label||'—'}</span>
        </div>
        <div style="font-size:12px;color:var(--t2)">${l.name||'—'} · ${l.location||'—'} · ${date}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
        <div style="text-align:center">
          <div style="font-family:var(--fd);font-size:24px;font-weight:700;color:${color}">${score}</div>
          <div style="font-size:9px;color:var(--t3)">SCORE</div>
        </div>
        <span class="tag" style="background:${fs.bg};color:${fs.color};border:1px solid ${fs.color}44">${fs.label}</span>
        <span style="font-size:11px;color:var(--t3)">${l.stage==='complete'?'✓ Full':'Stage 1'}</span>
      </div>
    </div>
    <div id="expand-${l.id}" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--br)">
      ${expandContent(l)}
    </div>
  </div>`;
}

function expandContent(l) {
  const sc2 = {};
  const findings = l.findings || [];
  const actions = l.actions || [];
  const cx = l.cx_analysis || {};
  const fs2 = l.follow_up_status || 'new';
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div>
        <div style="font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Contact</div>
        <div style="font-size:13px;margin-bottom:4px">📱 ${l.phone||'—'}</div>
        <div style="font-size:13px;margin-bottom:4px">✉️ ${l.email||'—'}</div>
        <div style="font-size:13px;color:var(--t2)">Goal: ${l.goal||'—'}</div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Financials</div>
        ${l.form_data ? `
          <div style="font-size:13px;margin-bottom:4px">Revenue: ${l.form_data.rev?`${l.market==='US'?'$':'₹'}${Number(l.form_data.rev).toLocaleString()}/mo`:'—'}</div>
          <div style="font-size:13px;margin-bottom:4px">Food Cost: ${l.form_data.fc||'—'}% | GP: ${l.form_data.gp||'—'}%</div>
          <div style="font-size:13px;color:var(--t2)">Labour: ${l.form_data.labour||'—'}%</div>
        ` : '<div style="font-size:13px;color:var(--t3)">No data</div>'}
      </div>
    </div>

    ${l.headline ? `<div style="background:var(--s2);border-radius:8px;padding:12px;margin-bottom:12px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--t2)">"${l.headline}"</div>` : ''}

    ${findings.length ? `<div style="margin-bottom:12px">
      <div style="font-size:10px;color:var(--ember);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Key Findings</div>
      ${findings.slice(0,3).map((f,i)=>`<div style="display:flex;gap:8px;margin-bottom:6px"><span style="color:var(--ember);font-weight:700;font-size:12px;flex-shrink:0">${i+1}</span><span style="font-size:13px;color:var(--t2)">${f}</span></div>`).join('')}
    </div>` : ''}

    ${l.plan ? `<div style="background:var(--s2);border-radius:8px;padding:12px;margin-bottom:12px">
      <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px">90-Day Plan</div>
      <p style="font-size:13px;color:var(--t2);line-height:1.6">${l.plan}</p>
    </div>` : ''}

    ${cx.cxScore ? `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      ${[['Entry',cx.entryScore],['Table',cx.tableScore],['Food',cx.foodScore],['Post-Meal',cx.postMealScore]].map(([label,s])=>`
      <div style="background:var(--s2);border:1px solid var(--br);border-radius:8px;padding:8px 12px;text-align:center;flex:1">
        <div style="font-size:16px;font-weight:700;color:${scH(s||0)}">${s||'—'}</div>
        <div style="font-size:10px;color:var(--t3)">${label}</div>
      </div>`).join('')}
    </div>` : ''}

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">
      <div style="font-size:11px;color:var(--t3);align-self:center">Update status:</div>
      ${['new','contacted','consultation_booked','converted'].map(s=>{
        const f=FS[s];
        const isActive=fs2===s;
        return `<button class="status-btn" onclick="updateStatus('${l.id}','${s}',event)" style="background:${isActive?f.color:f.bg};color:${isActive?'#fff':f.color};border:1px solid ${f.color}55">${f.label}</button>`;
      }).join('')}
    </div>

    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      ${l.phone?`<a href="https://wa.me/${l.phone.replace(/\D/g,'').replace(/^0/,'91')}?text=Hi ${encodeURIComponent(l.name||'')}! I reviewed your RestroRx diagnosis for ${encodeURIComponent(l.restaurant||'')} — score ${l.health_score}/100. Would love to discuss a revival consultation." target="_blank" style="background:#25D366;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none">💬 WhatsApp ${l.name||''}</a>`:''}
      ${l.email?`<a href="mailto:${l.email}?subject=RestroRx — Your ${l.restaurant||''} Diagnosis&body=Hi ${l.name||''},\n\nThank you for completing the RestroRx diagnosis for ${l.restaurant||''}.\n\nYour health score: ${l.health_score}/100 (${l.status_label||''}).\n\nI'd love to discuss a personal consultation.\n\nBest,\nChef Amey" style="background:var(--s2);color:var(--t1);border:1px solid var(--br);border-radius:8px;padding:8px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none">✉️ Email</a>`:''}
    </div>`;
}

function toggleExpand(id) {
  const el = document.getElementById(`expand-${id}`);
  const row = document.getElementById(`row-${id}`);
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'block';
  row.classList.toggle('expanded', !isOpen);
}

async function updateStatus(id, status, e) {
  e.stopPropagation();
  try {
    await sb.from('leads').update({ follow_up_status: status }).eq('id', id);
    const lead = allLeads.find(l => l.id === id);
    if (lead) lead.follow_up_status = status;
    renderLeads();
    // Re-expand
    setTimeout(() => {
      const el = document.getElementById(`expand-${id}`);
      if (el) el.style.display = 'block';
    }, 50);
  } catch (e) { alert('Update failed: ' + e.message); }
}

function exportCSV() {
  const headers = ['Date','Market','Restaurant','Location','Name','Phone','Email','Goal','Health Score','Status','Follow-up','Revenue','Food Cost %','GP %','Labour %','Headline','Plan'];
  const rows = allLeads.map(l => [
    new Date(l.created_at).toLocaleDateString('en-GB'),
    l.market, l.restaurant, l.location, l.name, l.phone, l.email, l.goal,
    l.health_score, l.status_label, l.follow_up_status,
    l.form_data?.rev, l.form_data?.fc, l.form_data?.gp, l.form_data?.labour,
    `"${(l.headline||'').replace(/"/g,'""')}"`,
    `"${(l.plan||'').replace(/"/g,'""')}"`
  ]);
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `restrorx-leads-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
</script>
</body>
</html>
