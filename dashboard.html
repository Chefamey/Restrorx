<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestroRx Dashboard — Chef Amey</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ember:#E8490A;--ember-d:rgba(232,73,10,0.13);
  --green:#1A9E5A;--green-d:rgba(26,158,90,0.12);
  --yellow:#C67E0A;--yellow-d:rgba(198,126,10,0.12);
  --red:#C0392B;--red-d:rgba(192,57,43,0.12);
  --blue:#1A6EBF;--blue-d:rgba(26,110,191,0.12);
  --wa:#25D366;
  --bg:#0C0C0C;--s1:#151515;--s2:#1D1D1D;--br:#272727;
  --t1:#EFEBE5;--t2:#9A9490;--t3:#5C5855;
  --ff:'Outfit',sans-serif;--fd:'Cormorant Garamond',serif
}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);min-height:100vh}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
input,select{font-family:var(--ff);background:var(--s2);border:1px solid var(--br);color:var(--t1);border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--ember)}
input::placeholder{color:var(--t3)}
select option{background:#1D1D1D}
.btn{background:var(--ember);color:#fff;border:none;border-radius:9px;padding:12px 24px;font-family:var(--ff);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.card{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:20px}
.stat{background:var(--s1);border:1px solid var(--br);border-radius:12px;padding:16px;text-align:center}
.lead{background:var(--s1);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;animation:fadeIn .3s ease both}
.lead:hover{border-color:rgba(232,73,10,.35)}
.lead.open{border-color:rgba(232,73,10,.4)}
.fb{background:transparent;color:var(--t2);border:1px solid var(--br);border-radius:20px;padding:6px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.fb.on{background:var(--ember);color:#fff;border-color:var(--ember)}
.bar-w{height:5px;border-radius:3px;background:var(--br);margin-top:6px;overflow:hidden}
.bar-f{height:100%;border-radius:3px;transition:width 1s ease}
.sb{border:none;border-radius:6px;padding:5px 10px;font-family:var(--ff);font-size:11px;font-weight:600;cursor:pointer;transition:opacity .15s}
.sb:hover{opacity:.8}
.fr{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--br)}
.fr:last-child{border-bottom:none;padding-bottom:0}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--s1);border:1px solid var(--br);border-radius:18px;padding:40px 32px;text-align:center;max-width:340px;width:100%">
    <div style="width:48px;height:48px;background:var(--ember);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 20px">🍽️</div>
    <h1 style="font-family:var(--fd);font-size:24px;font-weight:700;margin-bottom:6px">RestroRx</h1>
    <p style="font-size:13px;color:var(--t2);margin-bottom:24px">Chef Amey's Lead Dashboard</p>
    <input type="password" id="pwd" placeholder="Enter password" style="width:100%;margin-bottom:10px;text-align:center" onkeydown="if(event.key==='Enter')auth()">
    <div id="pwd-err" style="display:none;color:var(--red);font-size:13px;margin-bottom:10px">Incorrect password</div>
    <button class="btn" style="width:100%" onclick="auth()">Enter →</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash" style="display:none">
  <nav style="border-bottom:1px solid var(--br);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(12,12,12,.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;gap:9px">
      <div style="width:30px;height:30px;background:var(--ember);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px">🍽️</div>
      <div>
        <div style="font-family:var(--fd);font-size:17px;font-weight:700">RestroRx Dashboard</div>
        <div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:2px">Chef Amey Marathe</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="exportCSV()" style="background:var(--s2);border:1px solid var(--br);color:var(--t1);border-radius:8px;padding:7px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer">⬇ Export CSV</button>
      <button onclick="load()" style="background:var(--s2);border:1px solid var(--br);color:var(--t1);border-radius:8px;padding:7px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer">↻ Refresh</button>
    </div>
  </nav>

  <div style="max-width:880px;margin:0 auto;padding:24px 20px">

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      <div class="stat"><div id="st-total" style="font-family:var(--fd);font-size:30px;font-weight:700;color:var(--ember)">—</div><div style="font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">Total Leads</div></div>
      <div class="stat"><div id="st-week" style="font-family:var(--fd);font-size:30px;font-weight:700;color:var(--blue)">—</div><div style="font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">This Week</div></div>
      <div class="stat"><div id="st-avg" style="font-family:var(--fd);font-size:30px;font-weight:700;color:var(--yellow)">—</div><div style="font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">Avg Score</div></div>
      <div class="stat"><div id="st-crit" style="font-family:var(--fd);font-size:30px;font-weight:700;color:var(--red)">—</div><div style="font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1px">🔴 Critical</div></div>
    </div>

    <!-- Filters -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <input id="search" type="text" placeholder="Search restaurant or name..." style="flex:1;min-width:200px" oninput="render()">
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">
      <button class="fb on" data-f="all" onclick="setF('all',this)">All</button>
      <button class="fb" data-f="IN" onclick="setF('IN',this)">🇮🇳 India</button>
      <button class="fb" data-f="US" onclick="setF('US',this)">🇺🇸 US</button>
      <button class="fb" data-f="new" onclick="setF('new',this)">New</button>
      <button class="fb" data-f="contacted" onclick="setF('contacted',this)">Contacted</button>
      <button class="fb" data-f="consultation_booked" onclick="setF('consultation_booked',this)">Booked</button>
      <button class="fb" data-f="converted" onclick="setF('converted',this)">Converted ✓</button>
      <button class="fb" data-f="Critical" onclick="setF('Critical',this)">🔴 Critical</button>
    </div>

    <!-- Leads -->
    <div id="leads"></div>

  </div>
</div>

<script>
const SB_URL = 'https://dduiwrznrzmimqvmrcdg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdWl3cnpucnptaW1xdm1yY2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjY5NjAsImV4cCI6MjA5NDEwMjk2MH0.1-rjDnGkykflVZWnaHLGk1-b_oFqP1LX4dwb3Ro9IpY';
const PWD = 'RestroRx2024';
const sb = supabase.createClient(SB_URL, SB_KEY);

let all=[], filter='all';

const sc  = s => s>=70?'var(--green)':s>=45?'var(--yellow)':'var(--red)';
const scH = s => s>=70?'#1A9E5A':s>=45?'#C67E0A':'#C0392B';
const ST  = {
  'Healthy':   {c:'var(--green)',  bg:'var(--green-d)',  i:'●'},
  'Watch Zone':{c:'var(--yellow)', bg:'var(--yellow-d)', i:'◐'},
  'Critical':  {c:'var(--red)',    bg:'var(--red-d)',    i:'○'}
};
const FS  = {
  'new':                 {c:'var(--blue)',  bg:'var(--blue-d)',  l:'New'},
  'contacted':           {c:'var(--yellow)',bg:'var(--yellow-d)',l:'Contacted'},
  'consultation_booked': {c:'var(--ember)', bg:'var(--ember-d)', l:'Booked'},
  'converted':           {c:'var(--green)', bg:'var(--green-d)', l:'Converted ✓'}
};

function auth() {
  if(document.getElementById('pwd').value === PWD) {
    document.getElementById('gate').style.display='none';
    document.getElementById('dash').style.display='block';
    load();
  } else {
    document.getElementById('pwd-err').style.display='block';
    document.getElementById('pwd').value='';
  }
}

async function load() {
  document.getElementById('leads').innerHTML = `<div style="text-align:center;padding:60px;color:var(--t3)"><div style="width:32px;height:32px;border:2px solid var(--br);border-top-color:var(--ember);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px"></div>Loading leads...</div>`;
  try {
    const {data,error} = await sb.from('leads').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    all = data||[];
    updateStats();
    render();
  } catch(e) {
    document.getElementById('leads').innerHTML = `<div style="text-align:center;padding:40px;color:var(--red)">Failed to load: ${e.message}</div>`;
  }
}

function updateStats() {
  document.getElementById('st-total').textContent = all.length;
  const week = new Date(Date.now()-7*24*60*60*1000);
  document.getElementById('st-week').textContent = all.filter(l=>new Date(l.created_at)>week).length;
  const scored = all.filter(l=>l.health_score||l.final_score);
  document.getElementById('st-avg').textContent = scored.length ? Math.round(scored.reduce((s,l)=>s+(l.final_score||l.health_score||0),0)/scored.length) : '—';
  document.getElementById('st-crit').textContent = all.filter(l=>l.status_label==='Critical').length;
}

function setF(f,el) {
  filter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  render();
}

function getFiltered() {
  const q=(document.getElementById('search').value||'').toLowerCase();
  return all.filter(l=>{
    const ms=!q||(l.restaurant||'').toLowerCase().includes(q)||(l.name||'').toLowerCase().includes(q)||(l.location||'').toLowerCase().includes(q);
    let mf=true;
    if(filter==='IN') mf=l.market==='IN';
    else if(filter==='US') mf=l.market==='US';
    else if(filter==='new') mf=l.follow_up_status==='new';
    else if(filter==='contacted') mf=l.follow_up_status==='contacted';
    else if(filter==='consultation_booked') mf=l.follow_up_status==='consultation_booked';
    else if(filter==='converted') mf=l.follow_up_status==='converted';
    else if(filter==='Critical') mf=l.status_label==='Critical';
    return ms&&mf;
  });
}

function render() {
  const items=getFiltered();
  if(!items.length){document.getElementById('leads').innerHTML=`<div style="text-align:center;padding:60px;color:var(--t3)">No leads found</div>`;return;}
  document.getElementById('leads').innerHTML=items.map(l=>leadCard(l)).join('');
}

function bar(label,score){
  const color=scH(score);
  return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--t2)">${label}</span><span style="font-size:12px;font-weight:700;color:${color}">${score}/100</span></div><div class="bar-w"><div class="bar-f" style="width:${score}%;background:${color}"></div></div></div>`;
}

function leadCard(l) {
  const st=ST[l.status_label]||ST['Watch Zone'];
  const fs=FS[l.follow_up_status]||FS['new'];
  const score=l.final_score||l.health_score||0;
  const date=new Date(l.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const mkt=l.market==='IN'?'🇮🇳':l.market==='US'?'🇺🇸':'🌍';
  const cur=l.market==='US'?'$':'₹';
  const fd=l.form_data||{};
  const cx=l.cx_analysis||{};
  const finds=l.findings||[];

  return `<div class="lead" id="row-${l.id}" onclick="toggle('${l.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:15px">${mkt}</span>
          <span style="font-weight:600;font-size:15px">${l.restaurant||'Unknown'}</span>
          <span class="tag" style="background:${st.bg};color:${st.c};border:1px solid ${st.c}44;font-size:10px">${st.i} ${l.status_label||'—'}</span>
        </div>
        <div style="font-size:12px;color:var(--t2)">${l.name||'—'} · ${l.location||'—'} · ${date}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
        <div style="text-align:center">
          <div style="font-family:var(--fd);font-size:24px;font-weight:700;color:${sc(score)}">${score}</div>
          <div style="font-size:9px;color:var(--t3)">SCORE</div>
        </div>
        <span class="tag" style="background:${fs.bg};color:${fs.c};border:1px solid ${fs.c}44">${fs.l}</span>
        <span style="font-size:11px;color:var(--t3)">${l.stage==='complete'?'✓ Full':'S1'}</span>
      </div>
    </div>

    <div id="exp-${l.id}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--br)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px">
        <div>
          <div style="font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Contact</div>
          <div style="font-size:13px;margin-bottom:4px">📱 ${l.phone||'—'}</div>
          <div style="font-size:13px;margin-bottom:4px">✉️ ${l.email||'—'}</div>
          <div style="font-size:12px;color:var(--t3)">Goal: ${l.goal||'—'}</div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Financials</div>
          <div style="font-size:13px;margin-bottom:4px">Revenue: ${fd.rev?`${cur}${Number(fd.rev).toLocaleString()}/mo`:'—'}</div>
          <div style="font-size:13px;margin-bottom:4px">Food Cost: ${fd.fc||'—'}% | GP: ${fd.gp||'—'}%</div>
          <div style="font-size:12px;color:var(--t3)">Labour: ${fd.labour||'—'}%</div>
        </div>
      </div>

      ${l.headline?`<div style="background:var(--s2);border-radius:8px;padding:12px;margin-bottom:12px;font-family:var(--fd);font-style:italic;font-size:14px;color:var(--t2)">"${l.headline}"</div>`:''}

      ${finds.length?`<div style="margin-bottom:12px">
        <div style="font-size:10px;color:var(--ember);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Key Findings</div>
        ${finds.slice(0,3).map((f,i)=>`<div class="fr"><span style="color:var(--ember);font-weight:700;font-size:12px;flex-shrink:0">${i+1}</span><span style="font-size:13px;color:var(--t2)">${f}</span></div>`).join('')}
      </div>`:''}

      ${l.plan?`<div style="background:var(--s2);border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px">90-Day Plan</div>
        <p style="font-size:13px;color:var(--t2);line-height:1.6">${l.plan}</p>
      </div>`:''}

      ${cx.cxScore?`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        ${[['Entry',cx.entryScore],['Table',cx.tableScore],['Food',cx.foodScore],['Post-Meal',cx.postMealScore]].map(([n,s])=>`<div style="background:var(--s2);border:1px solid var(--br);border-radius:8px;padding:8px 12px;text-align:center;flex:1"><div style="font-size:16px;font-weight:700;color:${sc(s||0)}">${s||'—'}</div><div style="font-size:10px;color:var(--t3)">${n}</div></div>`).join('')}
      </div>`:''}

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
        <span style="font-size:11px;color:var(--t3)">Status:</span>
        ${['new','contacted','consultation_booked','converted'].map(s=>{
          const f=FS[s],isOn=l.follow_up_status===s;
          return `<button class="sb" onclick="updateStatus('${l.id}','${s}',event)" style="background:${isOn?f.c:f.bg};color:${isOn?'#fff':f.c};border:1px solid ${f.c}55">${f.l}</button>`;
        }).join('')}
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${l.phone?`<a href="https://wa.me/${(l.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(`Hi ${l.name||''}! I reviewed your RestroRx diagnosis for ${l.restaurant||''}. Score: ${score}/100 (${l.status_label||''}). I'd love to discuss a revival consultation.`)}" target="_blank" style="background:var(--wa);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none">💬 WhatsApp ${l.name||''}</a>`:''}
        ${l.email?`<a href="mailto:${l.email}?subject=RestroRx — Your ${l.restaurant||''} Diagnosis&body=Hi ${l.name||''},\n\nThank you for completing RestroRx for ${l.restaurant||''}. Your score: ${score}/100 (${l.status_label||''}).\n\nBest,\nChef Amey" style="background:var(--s2);color:var(--t1);border:1px solid var(--br);border-radius:8px;padding:8px 14px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none">✉️ Email</a>`:''}
      </div>
    </div>
  </div>`;
}

function toggle(id) {
  const el=document.getElementById('exp-'+id);
  const row=document.getElementById('row-'+id);
  const open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  row.classList.toggle('open',!open);
}

async function updateStatus(id,status,e) {
  e.stopPropagation();
  try {
    await sb.from('leads').update({follow_up_status:status}).eq('id',id);
    const lead=all.find(l=>l.id===id);
    if(lead) lead.follow_up_status=status;
    render();
    setTimeout(()=>{const el=document.getElementById('exp-'+id);if(el)el.style.display='block';},50);
  } catch(e){alert('Update failed: '+e.message);}
}

function exportCSV() {
  const heads=['Date','Market','Restaurant','Location','Name','Phone','Email','Goal','Score','Status','Follow-up','Stage','Revenue','Food Cost%','GP%','Labour%'];
  const rows=all.map(l=>[
    new Date(l.created_at).toLocaleDateString('en-GB'),
    l.market,l.restaurant,l.location,l.name,l.phone,l.email,l.goal,
    l.final_score||l.health_score,l.status_label,l.follow_up_status,l.stage,
    l.form_data?.rev,l.form_data?.fc,l.form_data?.gp,l.form_data?.labour
  ]);
  const csv=[heads,...rows].map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`restrorx-leads-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
</script>
</body>
</html>
